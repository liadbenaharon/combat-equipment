plugins {
    id 'com.android.application'
}

def signingValues = [
    System.getenv('ANDROID_KEYSTORE_PATH'),
    System.getenv('ANDROID_KEYSTORE_PASSWORD'),
    System.getenv('ANDROID_KEY_ALIAS'),
    System.getenv('ANDROID_KEY_PASSWORD')
]
def hasReleaseSigning = signingValues.every { it != null && !it.trim().isEmpty() }

android {
    namespace 'com.liadbenaharon.combatequipment'
    compileSdk 36

    defaultConfig {
        applicationId 'com.liadbenaharon.combatequipment'
        minSdk 24
        targetSdk 36
        versionCode 264
        versionName '2.4.19'
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            // Keep the native WebView shell easy to diagnose and reliable.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// The web app is packaged into the APK so it opens without a connection (served by MainActivity from www/).
def bundledWebDir = layout.buildDirectory.dir('generated/bundledWeb').get().asFile
def copyWebApp = tasks.register('copyWebApp', Sync) {
    from(rootProject.projectDir.parentFile) {
        include 'index.html', 'privacy.html', 'delete-account.html', 'manifest.webmanifest'
        include '*.js', '*.css', '*.png', '*.svg', 'fonts/**'
        exclude 'sw.js', 'cloud-sync.js'
    }
    into new File(bundledWebDir, 'www')
}
android.sourceSets.main.assets.srcDir(bundledWebDir)
preBuild.dependsOn(copyWebApp)

dependencies {
}
