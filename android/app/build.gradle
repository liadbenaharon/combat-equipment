plugins {
    id 'com.android.application'
}

def signingValues = [
    System.getenv('ANDROID_KEYSTORE_PATH'),
    System.getenv('ANDROID_KEYSTORE_PASSWORD'),
    System.getenv('ANDROID_KEY_ALIAS'),
    System.getenv('ANDROID_KEY_PASSWORD')
]
def hasReleaseSigning = signingValues.every { it != null && !it.trim().isEmpty() }

android {
    namespace 'com.liadbenaharon.combatequipment'
    compileSdk 36

    defaultConfig {
        applicationId 'com.liadbenaharon.combatequipment'
        minSdk 24
        targetSdk 36
        versionCode 261
        versionName '2.4.11'
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            // Keep the native WebView shell easy to diagnose and reliable.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
