<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d2517">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>ניהול ציוד - כושר קרבי</title>
<style>
:root{--bg:#10130e;--panel:#1c2119;--panel2:#252d20;--line:#4e5947;--text:#f4f2e8;--muted:#b8baaf;--orange:#f07a22;--orange2:#ff9a4e;--red:#d75f55;--green:#7da866}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100vh;background:linear-gradient(#171b13,#0f120d);color:var(--text);font-family:Arial,"Noto Sans Hebrew",sans-serif}button,input{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:auto;padding:14px 14px 100px}.top{position:sticky;top:0;z-index:20;padding:8px 0 12px;background:rgba(16,19,14,.95);backdrop-filter:blur(12px)}.headline{display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:23px;margin:0}.date{font-size:13px;color:var(--muted);margin-top:6px}.badge{background:#2d261c;border:1px solid #73583b;color:#ffd0aa;padding:7px 10px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}.tab{min-height:45px;border:1px solid var(--line);border-radius:12px;background:#20251c;color:var(--muted);font-weight:900}.tab.active{background:var(--orange);border-color:var(--orange);color:#19120c}.section{display:none}.section.active{display:block}.summaryBar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;background:#1b2118;border:1px solid #3b4635;border-radius:15px;padding:12px}.stat strong{display:block;font-size:20px}.stat span{font-size:11px;color:var(--muted)}.titleRow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:16px 2px 8px}.titleRow h2{font-size:18px;margin:0}.hint{font-size:12px;color:var(--muted)}.card{background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid #3b4436;border-radius:17px;margin:11px 0;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.22)}.head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px}.equip{display:flex;align-items:center;gap:11px}.icon{width:45px;height:45px;border:1px solid #4c5842;border-radius:12px;background:#11150f;display:grid;place-items:center;font-size:25px}.name{font-size:18px;font-weight:900}.sub{font-size:12px;color:var(--muted);margin-top:3px}.count{background:#10140e;border:1px solid #4a5542;border-radius:10px;padding:7px 9px;font-weight:900}.units{display:flex;flex-wrap:wrap;gap:7px;padding:0 14px 13px}.unit{width:42px;height:42px;border-radius:10px;border:1px solid #65705b;background:#151a13;color:#d7d8d2;font-weight:900}.unit.on{background:var(--orange);border-color:var(--orange);color:#17110d}.progress{height:7px;background:#10140e;margin:0 14px 13px;border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;background:var(--orange)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 14px 14px}.btn{min-height:47px;border:1px solid #626b59;border-radius:12px;background:#2b3327;color:var(--text);font-weight:900;padding:11px}.btn.primary{background:var(--orange);border-color:var(--orange);color:#17110d}.btn.danger{background:#39211f;border-color:#74423d;color:#ffd3ce}.btn.small{min-height:37px;padding:7px 10px;font-size:12px}.assigns{padding:0 14px 14px}.assignment{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#151a13;border:1px solid #3c4637;border-radius:11px;padding:9px;margin-top:7px}.person{font-weight:900}.mini{color:var(--muted);font-size:12px}.floating{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(732px,calc(100% - 28px));display:grid;grid-template-columns:1.35fr 1fr;gap:8px;padding:8px;border:1px solid #3e4638;border-radius:16px;background:rgba(15,18,13,.95);z-index:30}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;display:none;align-items:flex-end;padding:12px}.overlay.show{display:flex}.modal{width:min(720px,100%);margin:auto;background:#20261c;border:1px solid #535d4a;border-radius:20px 20px 14px 14px;padding:17px}.modal h2{margin:0 0 14px}.field{margin:10px 0}.field label{display:block;font-weight:800;margin-bottom:6px}.input{width:100%;border:1px solid #626b59;background:#10140e;color:#fff;border-radius:11px;padding:13px}.modalBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}.empty{text-align:center;color:var(--muted);padding:28px}.personCard,.historyItem{padding:14px}.personCard+.personCard,.historyItem+.historyItem{border-top:1px solid #3d4638}.personName,.historyDate{font-size:18px;font-weight:900}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.chip{background:#12170f;border:1px solid #4c5843;border-radius:999px;padding:6px 9px;font-size:12px}.historyTop{display:flex;justify-content:space-between;align-items:center}.pill{font-size:11px;border:1px solid #4d5a45;border-radius:999px;padding:5px 8px}.list{list-style:none;padding:0;margin:9px 0 0}.list li{padding:7px 0;border-bottom:1px dashed #394234}@media(min-width:700px){.floating{position:sticky;transform:none;left:auto;width:100%;margin-top:15px}}
</style>
</head>
<body>
<div class="app">
<header class="top">
<div class="headline"><div><h1>תחילת אימון · אישור ציוד</h1><div id="today" class="date"></div></div><div class="badge">🎒 ציוד אימון</div></div>
<div class="tabs"><button class="tab active" data-tab="check">אישור ציוד</button><button class="tab" data-tab="summary">סיכום</button><button class="tab" data-tab="history">היסטוריה</button></div>
</header>
<main>
<section id="check" class="section active"><div class="summaryBar"><div class="stat"><strong id="statTotal">0</strong><span>סה״כ יחידות</span></div><div class="stat"><strong id="statChecked">0</strong><span>אושרו</span></div><div class="stat"><strong id="statAssigned">0</strong><span>משויכות</span></div></div><div class="titleRow"><h2>רשימת ציוד</h2><span class="hint">לחיצה על מספר מסמנת ✓</span></div><div id="equipmentList"></div></section>
<section id="summary" class="section"><div class="titleRow"><h2>מי סוחב מה</h2><span id="summaryCount" class="hint"></span></div><div class="card" id="peopleSummary"></div></section>
<section id="history" class="section"><div class="titleRow"><h2>אימונים קודמים</h2><button id="clearHistory" class="btn small danger">נקה היסטוריה</button></div><div class="card" id="historyList"></div></section>
</main>
<div class="floating"><button id="finishBtn" class="btn primary">סיום אימון ושמירה</button><button id="addEquipmentBtn" class="btn">＋ הוספת ציוד</button></div>
</div>
<div id="equipmentModal" class="overlay"><div class="modal"><h2>הוספת ציוד חדש</h2><div class="field"><label>שם הפריט</label><input id="newEquipName" class="input" placeholder="לדוגמה: חבל"></div><div class="field"><label>כמות</label><input id="newEquipQty" class="input" type="number" min="1" max="100" value="1"></div><div class="modalBtns"><button class="btn" data-close="equipmentModal">ביטול</button><button id="saveEquipment" class="btn primary">הוסף</button></div></div></div>
<div id="assignModal" class="overlay"><div class="modal"><h2 id="assignTitle">שיוך ציוד</h2><input id="assignEquipmentId" type="hidden"><div class="field"><label>שם המתאמן</label><input id="personName" class="input" placeholder="לדוגמה: דניאל א."></div><div class="field"><label>כמות שלקח</label><input id="personQty" class="input" type="number" min="1" value="1"></div><div id="assignHint" class="hint"></div><div class="modalBtns"><button class="btn" data-close="assignModal">ביטול</button><button id="saveAssignment" class="btn primary">שמור שיוך</button></div></div></div>
<script>
const KEY='combatEquipmentStateV1',HISTORY_KEY='combatEquipmentHistoryV1';
const defaults=[['jerrycan','ג׳ריקן','💧',5],['stretcher','אלונקה','🟧',3],['sandbags','שק שקים','🧺',20],['vest-green','ווסט ירוק','🦺',8],['vest-black','ווסט שחור','⬛',8],['light','תאורה','🔦',10],['anchor','עוגן','⚓',1]].map(([id,name,icon,qty])=>({id,name,icon,qty,checked:Array(qty).fill(false),assignments:[]}));
let state=load();
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s?.equipment)return s}catch(e){}return{equipment:structuredClone(defaults)}}
function save(){localStorage.setItem(KEY,JSON.stringify(state));renderAll()}
function histories(){try{return JSON.parse(localStorage.getItem(HISTORY_KEY))||[]}catch(e){return[]}}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[m]))}
function assigned(eq){return eq.assignments.reduce((n,a)=>n+Number(a.qty||0),0)}function checked(eq){return eq.checked.filter(Boolean).length}
document.getElementById('today').textContent='📅 '+new Intl.DateTimeFormat('he-IL',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date());
function renderEquipment(){document.getElementById('equipmentList').innerHTML=state.equipment.map(eq=>{const c=checked(eq),a=assigned(eq),p=eq.qty?c/eq.qty*100:0;return `<article class="card"><div class="head"><div class="equip"><div class="icon">${eq.icon||'🎒'}</div><div><div class="name">${esc(eq.name)}</div><div class="sub">אושרו ${c} מתוך ${eq.qty} · משויכים ${a}</div></div></div><div class="count">${c}/${eq.qty}</div></div><div class="units">${eq.checked.map((v,i)=>`<button class="unit ${v?'on':''}" onclick="toggleUnit('${eq.id}',${i})">${v?'✓':i+1}</button>`).join('')}</div><div class="progress"><i style="width:${p}%"></i></div><div class="actions"><button class="btn primary" onclick="openAssign('${eq.id}')">שיוך למתאמן</button><button class="btn" onclick="changeQty('${eq.id}')">שינוי כמות</button></div>${eq.assignments.length?`<div class="assigns">${eq.assignments.map((x,i)=>`<div class="assignment"><div><div class="person">${esc(x.name)}</div><div class="mini">${x.qty} × ${esc(eq.name)}</div></div><button class="btn small danger" onclick="removeAssign('${eq.id}',${i})">הסר</button></div>`).join('')}</div>`:''}</article>`}).join('')}
function renderStats(){const t=state.equipment.reduce((n,e)=>n+e.qty,0),c=state.equipment.reduce((n,e)=>n+checked(e),0),a=state.equipment.reduce((n,e)=>n+assigned(e),0);statTotal.textContent=t;statChecked.textContent=c;statAssigned.textContent=a}
function renderSummary(){const people={};state.equipment.forEach(e=>e.assignments.forEach(a=>{(people[a.name]??=[]).push({name:e.name,qty:a.qty})}));const names=Object.keys(people);summaryCount.textContent=names.length?`${names.length} מתאמנים`:'';peopleSummary.innerHTML=names.length?names.map(n=>`<div class="personCard"><div class="personName">${esc(n)}</div><div class="chips">${people[n].map(x=>`<span class="chip">${x.qty} × ${esc(x.name)}</span>`).join('')}</div></div>`).join(''):'<div class="empty">עדיין לא שויך ציוד למתאמנים</div>'}
function renderHistory(){const h=histories();historyList.innerHTML=h.length?h.map(x=>`<div class="historyItem"><div class="historyTop"><div class="historyDate">${esc(x.date)}</div><span class="pill">${x.total} יחידות</span></div><ul class="list">${x.people.length?x.people.map(p=>`<li><b>${esc(p.name)}</b> — ${p.items.map(i=>`${i.qty} × ${esc(i.name)}`).join(', ')}</li>`).join(''):'<li>ללא שיוכים</li>'}</ul></div>`).join(''):'<div class="empty">אין עדיין אימונים שמורים</div>'}
function renderAll(){renderEquipment();renderStats();renderSummary();renderHistory()}window.toggleUnit=(id,i)=>{const e=state.equipment.find(x=>x.id===id);e.checked[i]=!e.checked[i];save()};window.openAssign=id=>{const e=state.equipment.find(x=>x.id===id);assignEquipmentId.value=id;assignTitle.textContent='שיוך · '+e.name;personName.value='';personQty.value=1;assignHint.textContent=`נותרו לשיוך: ${Math.max(0,e.qty-assigned(e))}`;assignModal.classList.add('show');personName.focus()};window.changeQty=id=>{const e=state.equipment.find(x=>x.id===id),v=Number(prompt('כמות חדשה עבור '+e.name,e.qty));if(!Number.isInteger(v)||v<1||v>100)return;e.qty=v;e.checked=[...e.checked.slice(0,v),...Array(Math.max(0,v-e.checked.length)).fill(false)];save()};window.removeAssign=(id,i)=>{state.equipment.find(x=>x.id===id).assignments.splice(i,1);save()};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.section').forEach(s=>s.classList.toggle('active',s.id===b.dataset.tab));if(b.dataset.tab==='summary')renderSummary();if(b.dataset.tab==='history')renderHistory()});
addEquipmentBtn.onclick=()=>{newEquipName.value='';newEquipQty.value=1;equipmentModal.classList.add('show');newEquipName.focus()};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.close).classList.remove('show'));document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('show')}));
saveEquipment.onclick=()=>{const name=newEquipName.value.trim(),qty=Number(newEquipQty.value);if(!name||!Number.isInteger(qty)||qty<1)return alert('יש להזין שם וכמות תקינה');state.equipment.push({id:'custom-'+Date.now(),name,icon:'🎒',qty,checked:Array(qty).fill(false),assignments:[]});equipmentModal.classList.remove('show');save()};
saveAssignment.onclick=()=>{const e=state.equipment.find(x=>x.id===assignEquipmentId.value),name=personName.value.trim(),qty=Number(personQty.value),left=e.qty-assigned(e);if(!name)return alert('יש להזין שם מתאמן');if(!Number.isInteger(qty)||qty<1)return alert('יש להזין כמות תקינה');if(qty>left)return alert(`נותרו רק ${left} יחידות לשיוך`);e.assignments.push({name,qty});assignModal.classList.remove('show');save()};
finishBtn.onclick=()=>{if(!confirm('לשמור את האימון בהיסטוריה ולהתחיל אימון חדש?'))return;const people={};state.equipment.forEach(e=>e.assignments.forEach(a=>{(people[a.name]??=[]).push({name:e.name,qty:a.qty})}));const h=histories();h.unshift({id:Date.now(),date:new Intl.DateTimeFormat('he-IL',{dateStyle:'medium',timeStyle:'short'}).format(new Date()),total:state.equipment.reduce((n,e)=>n+e.qty,0),people:Object.entries(people).map(([name,items])=>({name,items})),equipment:structuredClone(state.equipment)});localStorage.setItem(HISTORY_KEY,JSON.stringify(h.slice(0,100)));state.equipment=state.equipment.map(e=>({...e,checked:Array(e.qty).fill(false),assignments:[]}));save();alert('האימון נשמר בהיסטוריה')};clearHistory.onclick=()=>{if(confirm('למחוק את כל היסטוריית האימונים?')){localStorage.removeItem(HISTORY_KEY);renderHistory()}};
renderAll();
</script>
<script src="./equipment-icons.js?v=7"></script>
<script src="./quantity-shortcut.js?v=2"></script>
<script src="./history-collapse.js?v=1"></script>
<script src="./attendance.js?v=8"></script>
<script src="./contacts-count.js?v=1"></script>
</body></html>
