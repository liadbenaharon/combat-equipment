<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#1d2517" />
  <title>אישור ציוד - אימון כושר קרבי</title>
  <style>
    :root{
      --bg:#11140f;--panel:#1c2119;--panel2:#252d20;--olive:#39462f;--olive2:#4b5c3e;
      --text:#f4f2e8;--muted:#b9b8aa;--line:#59614e;--orange:#f07a22;--orange2:#ff9a4e;
      --green:#82b56a;--red:#d75f55;--shadow:0 10px 28px rgba(0,0,0,.26);--r:18px;
    }
    *{box-sizing:border-box}
    html{background:var(--bg)}
    body{margin:0;background:linear-gradient(180deg,#171b13 0,#10130e 100%);color:var(--text);font-family:Arial,"Noto Sans Hebrew",sans-serif;min-height:100vh}
    button,input,textarea{font:inherit}
    button{cursor:pointer}
    .app{max-width:760px;margin:auto;min-height:100vh;padding:16px 14px 92px}
    .top{position:sticky;top:0;z-index:20;background:rgba(17,20,15,.94);backdrop-filter:blur(12px);padding:8px 0 14px}
    .headline{display:flex;align-items:center;justify-content:space-between;gap:12px}
    h1{font-size:25px;margin:0;font-weight:900;letter-spacing:-.4px}
    .date{margin-top:7px;color:var(--muted);font-size:14px;font-weight:700}
    .badge{display:inline-flex;align-items:center;gap:7px;border:1px solid #6f5638;background:#2b2419;color:#ffd1a7;padding:8px 11px;border-radius:999px;font-weight:800;font-size:13px;white-space:nowrap}
    .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
    .tab{border:1px solid var(--line);background:#20251c;color:var(--muted);padding:12px 8px;border-radius:13px;font-weight:900}
    .tab.active{background:var(--orange);border-color:var(--orange);color:#17120d}
    .section{display:none}.section.active{display:block}
    .card{background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid #3b4436;border-radius:var(--r);box-shadow:var(--shadow);margin:12px 0;overflow:hidden}
    .cardHead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px}
    .equipTitle{display:flex;align-items:center;gap:12px;min-width:0}
    .icon{width:46px;height:46px;border-radius:13px;background:#11150f;border:1px solid #4c5842;display:grid;place-items:center;font-size:27px;flex:0 0 auto}
    .name{font-weight:900;font-size:19px}.sub{color:var(--muted);font-size:13px;margin-top:3px}
    .counter{font-weight:900;background:#10140e;border:1px solid #4a5542;border-radius:11px;padding:8px 10px;white-space:nowrap}
    .units{display:flex;flex-wrap:wrap;gap:8px;padding:0 15px 14px}
    .unit{width:42px;height:42px;border-radius:11px;border:1px solid #65705b;background:#161b14;color:#d2d5cb;font-weight:900;font-size:17px}
    .unit.checked{background:var(--orange);color:#17110d;border-color:var(--orange);box-shadow:inset 0 0 0 2px rgba(255,255,255,.12)}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:0 15px 15px}
    .btn{border:1px solid #666d5b;background:#2b3327;color:var(--text);padding:13px 12px;border-radius:12px;font-weight:900;min-height:48px}
    .btn.primary{background:var(--orange);color:#18110b;border-color:var(--orange)}
    .btn.ghost{background:#181c16}.btn.danger{background:#39211f;border-color:#75423e;color:#ffd3ce}
    .small{padding:9px 11px;min-height:auto;font-size:13px}
    .progress{height:8px;background:#10140e;margin:0 15px 15px;border-radius:999px;overflow:hidden;border:1px solid #3f4839}.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),var(--orange2));width:0}
    .summaryBar{background:#1b2118;border:1px solid #3b4635;border-radius:16px;padding:13px;margin:10px 0 14px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
    .stat strong{display:block;font-size:20px}.stat span{color:var(--muted);font-size:12px}
    .floating{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));z-index:30;width:min(732px,calc(100% - 28px));display:grid;grid-template-columns:1.35fr 1fr;gap:9px;background:rgba(15,18,13,.93);padding:9px;border:1px solid #3e4638;border-radius:17px;backdrop-filter:blur(12px)}
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.68);z-index:50;display:none;align-items:flex-end;justify-content:center;padding:12px}.overlay.show{display:flex}
    .modal{width:min(720px,100%);max-height:88vh;overflow:auto;background:#20261c;border:1px solid #535d4a;border-radius:22px 22px 14px 14px;padding:18px;box-shadow:0 20px 70px rgba(0,0,0,.5)}
    .modal h2{margin:0 0 15px}.field{margin:11px 0}.field label{display:block;color:#d7d7cc;font-weight:800;margin-bottom:7px}.input{width:100%;border:1px solid #626b59;background:#10140e;color:#fff;padding:13px;border-radius:12px;outline:none}.input:focus{border-color:var(--orange)}
    .row{display:grid;grid-template-columns:1fr 120px;gap:9px}.modalBtns{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}
    .assignments{padding:0 15px 15px}.assignment{display:flex;justify-content:space-between;gap:10px;align-items:center;background:#151a13;border:1px solid #3c4637;border-radius:12px;padding:10px;margin-top:8px}.assignment .who{font-weight:900}.assignment .what{font-size:13px;color:var(--muted);margin-top:3px}
    .historyItem{padding:15px}.historyItem+.historyItem{border-top:1px solid #3d4638}.historyTop{display:flex;justify-content:space-between;align-items:center;gap:10px}.historyDate{font-size:18px;font-weight:900}.pill{border:1px solid #4d5a45;background:#161c14;padding:5px 9px;border-radius:999px;font-size:12px;color:#cdd0c6}.list{margin:10px 0 0;padding:0;list-style:none}.list li{padding:8px 0;border-bottom:1px dashed #394234}.empty{padding:28px;text-align:center;color:var(--muted)}
    .personCard{padding:15px}.personCard+.personCard{border-top:1px solid #3d4638}.personName{font-size:18px;font-weight:900}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.chip{background:#12170f;border:1px solid #4c5843;border-radius:999px;padding:7px 10px;font-size:13px}.orange{color:var(--orange2)}
    .sectionTitle{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:16px 2px 8px}.sectionTitle h2{font-size:18px;margin:0}.hint{color:var(--muted);font-size:13px;line-height:1.45}
    @media(min-width:700px){.app{padding-top:24px}.cardHead{padding:18px}.units{padding-inline:18px}.actions{padding-inline:18px}.floating{position:sticky;bottom:10px;margin-top:18px;transform:none;left:auto;width:100%}}
  </style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="headline"><div><h1>מחילת אימון · אישור ציוד</h1><div class="date" id="today"></div></div><div class="badge">🎒 ציוד אימון</div></div>
    <div class="tabs"><button class="tab active" data-tab="check">אישור ציוד</button><button class="tab" data-tab="summary">סיכום</button><button class="tab" data-tab="history">היסטוריה</button></div>
  </header>

  <main>
    <section id="check" class="section active">
      <div class="summaryBar"><div class="stat"><strong id="statTotal">0</strong><span>סה״כ יחידות</span></div><div class="stat"><strong id="statChecked">0</strong><span>אושרו</span></div><div class="stat"><strong id="statAssigned">0</strong><span>משויכות</span></div></div>
      <div class="sectionTitle"><h2>רשימת ציוד</h2><span class="hint">לחיצה על מספר מסמנת V</span></div>
      <div id="equipmentList"></div>
    </section>

    <section id="summary" class="section">
      <div class="sectionTitle"><h2>מי סוחב מה</h2><span class="hint" id="summaryCount"></span></div>
      <div class="card" id="peopleSummary"></div>
    </section>

    <section id="history" class="section">
      <div class="sectionTitle"><h2>אימונים קודמים</h2><button class="btn small danger" id="clearHistory">נקה היסטוריה</button></div>
      <div class="card" id="historyList"></div>
    </section>
  </main>

  <div class="floating"><button class="btn primary" id="finishBtn">סיום אימון ושמירה</button><button class="btn" id="addEquipmentBtn">＋ הוספת ציוד</button></div>
</div>

<div class="overlay" id="equipmentModal"><div class="modal"><h2>הוספת ציוד חדש</h2><div class="field"><label>שם הפריט</label><input id="newEquipName" class="input" placeholder="לדוגמה: חבל" /></div><div class="field"><label>כמות</label><input id="newEquipQty" class="input" type="number" min="1" max="100" value="1" /></div><div class="modalBtns"><button class="btn ghost" data-close="equipmentModal">ביטול</button><button class="btn primary" id="saveEquipment">הוסף</button></div></div></div>

<div class="overlay" id="assignModal"><div class="modal"><h2 id="assignTitle">שיוך ציוד</h2><input type="hidden" id="assignEquipmentId"/><div class="field"><label>שם המתאמן</label><input id="personName" class="input" placeholder="לדוגמה: דניאל א." /></div><div class="field"><label>כמות שלקח</label><input id="personQty" class="input" type="number" min="1" value="1" /></div><div class="hint" id="assignHint"></div><div class="modalBtns"><button class="btn ghost" data-close="assignModal">ביטול</button><button class="btn primary" id="saveAssignment">שמור שיוך</button></div></div></div>

<script>
const KEY='combatEquipmentStateV1', HISTORY_KEY='combatEquipmentHistoryV1';
const defaults=[
  {id:'jerrycan',name:'ג׳ריקן',icon:'🪖',qty:5},
  {id:'stretcher',name:'אלונקה',icon:'🟧',qty:3},
  {id:'sandbags',name:'שק שקים',icon:'🧺',qty:20},
  {id:'vest-green',name:'ווסט ירוק',icon:'🦺',qty:8},
  {id:'vest-black',name:'ווסט שחור',icon:'⬛',qty:8},
  {id:'light',name:'תאורה',icon:'🔦',qty:10},
  {id:'anchor',name:'עוגן',icon:'⚓',qty:1}
].map(x=>({...x,checked:Array(x.qty).fill(false),assignments:[]}));
let state=loadState();
function loadState(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s?.equipment)return s}catch(e){}return {equipment:structuredClone(defaults)} }
function save(){localStorage.setItem(KEY,JSON.stringify(state));renderAll()}
function histories(){try{return JSON.parse(localStorage.getItem(HISTORY_KEY))||[]}catch(e){return []}}
function saveHistories(v){localStorage.setItem(HISTORY_KEY,JSON.stringify(v))}
const fmtDate=(d=new Date())=>new Intl.DateTimeFormat('he-IL',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'}).format(d);
document.getElementById('today').textContent='📅 '+fmtDate();

function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function totalAssigned(eq){return eq.assignments.reduce((a,b)=>a+Number(b.qty||0),0)}
function checkedCount(eq){return eq.checked.filter(Boolean).length}
function renderEquipment(){
 const wrap=document.getElementById('equipmentList');
 wrap.innerHTML=state.equipment.map(eq=>{
   const checked=checkedCount(eq), assigned=totalAssigned(eq), pct=eq.qty?checked/eq.qty*100:0;
   return `<article class="card">
    <div class="cardHead"><div class="equipTitle"><div class="icon">${eq.icon||'🎒'}</div><div><div class="name">${esc(eq.name)}</div><div class="sub">אושרו ${checked} מתוך ${eq.qty} · משויכים ${assigned}</div></div></div><div class="counter">${checked}/${eq.qty}</div></div>
    <div class="units">${eq.checked.map((v,i)=>`<button class="unit ${v?'checked':''}" onclick="toggleUnit('${eq.id}',${i})" aria-label="יחידה ${i+1}">${v?'✓':i+1}</button>`).join('')}</div>
    <div class="progress"><i style="width:${pct}%"></i></div>
    ${eq.assignments.length?`<div class="assignments">${eq.assignments.map((a,i)=>`<div class="assignment"><div><div class="who">${esc(a.name)}</div><div class="what">${a.qty} × ${esc(eq.name)}</div></div><button class="btn small danger" onclick="removeAssignment('${eq.id}',${i})">הסר</button></div>`).join('')}</div>`:''}
    <div class="actions"><button class="btn primary" onclick="openAssign('${eq.id}')">✎ שיוך למתאמן</button><button class="btn" onclick="setAll('${eq.id}',${checked!==eq.qty})">${checked===eq.qty?'בטל הכל':'אשר הכל'}</button></div>
   </article>`
 }).join('');
 const total=state.equipment.reduce((n,e)=>n+e.qty,0), checked=state.equipment.reduce((n,e)=>n+checkedCount(e),0), assigned=state.equipment.reduce((n,e)=>n+totalAssigned(e),0);
 document.getElementById('statTotal').textContent=total;document.getElementById('statChecked').textContent=checked;document.getElementById('statAssigned').textContent=assigned;
}
function toggleUnit(id,i){const e=state.equipment.find(x=>x.id===id);e.checked[i]=!e.checked[i];save()}
function setAll(id,val){const e=state.equipment.find(x=>x.id===id);e.checked=e.checked.map(()=>val);save()}
function removeAssignment(id,i){const e=state.equipment.find(x=>x.id===id);e.assignments.splice(i,1);save()}

function renderSummary(){
 const map={}; state.equipment.forEach(eq=>eq.assignments.forEach(a=>{if(!map[a.name])map[a.name]=[];map[a.name].push({equipment:eq.name,qty:a.qty})}));
 const people=Object.entries(map); document.getElementById('summaryCount').textContent=people.length?`${people.length} מתאמנים`:'';
 document.getElementById('peopleSummary').innerHTML=people.length?people.map(([name,items])=>`<div class="personCard"><div class="personName">${esc(name)}</div><div class="chips">${items.map(i=>`<span class="chip"><b class="orange">${i.qty}</b> × ${esc(i.equipment)}</span>`).join('')}</div></div>`).join(''):'<div class="empty">עדיין לא שויכו פריטים למתאמנים.</div>';
}
function renderHistory(){
 const h=histories(); const el=document.getElementById('historyList');
 el.innerHTML=h.length?h.map(item=>`<div class="historyItem"><div class="historyTop"><div class="historyDate">${esc(item.dateLabel)}</div><span class="pill">${item.checked}/${item.total} אושרו</span></div>${item.people.length?`<ul class="list">${item.people.map(p=>`<li><b>${esc(p.name)}</b> — ${p.items.map(i=>`${i.qty} × ${esc(i.equipment)}`).join(', ')}</li>`).join('')}</ul>`:'<div class="hint" style="margin-top:8px">ללא שיוכים</div>'}</div>`).join(''):'<div class="empty">אין עדיין אימונים שמורים.</div>';
}
function renderAll(){renderEquipment();renderSummary();renderHistory()}

function openModal(id){document.getElementById(id).classList.add('show')}
function closeModal(id){document.getElementById(id).classList.remove('show')}
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeModal(b.dataset.close));
document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('show')}));

document.getElementById('addEquipmentBtn').onclick=()=>{document.getElementById('newEquipName').value='';document.getElementById('newEquipQty').value=1;openModal('equipmentModal')};
document.getElementById('saveEquipment').onclick=()=>{
 const name=document.getElementById('newEquipName').value.trim(), qty=Math.max(1,Math.min(100,Number(document.getElementById('newEquipQty').value)||1));
 if(!name)return alert('יש להזין שם פריט.');
 state.equipment.push({id:'custom-'+Date.now(),name,icon:'🎒',qty,checked:Array(qty).fill(false),assignments:[]});closeModal('equipmentModal');save();
};
function openAssign(id){
 const e=state.equipment.find(x=>x.id===id), remaining=Math.max(0,e.qty-totalAssigned(e));
 document.getElementById('assignEquipmentId').value=id;document.getElementById('assignTitle').textContent='שיוך '+e.name;document.getElementById('personName').value='';document.getElementById('personQty').value=remaining?1:0;document.getElementById('personQty').max=Math.max(1,remaining);document.getElementById('assignHint').textContent=`נותרו לשיוך: ${remaining} מתוך ${e.qty}`;openModal('assignModal');
}
document.getElementById('saveAssignment').onclick=()=>{
 const id=document.getElementById('assignEquipmentId').value,e=state.equipment.find(x=>x.id===id),name=document.getElementById('personName').value.trim(),qty=Number(document.getElementById('personQty').value)||0,remaining=e.qty-totalAssigned(e);
 if(!name)return alert('יש להזין שם מתאמן.'); if(qty<1)return alert('הכמות חייבת להיות לפחות 1.'); if(qty>remaining)return alert(`אפשר לשייך כרגע עד ${remaining} יחידות.`);
 e.assignments.push({name,qty});closeModal('assignModal');save();
};

document.getElementById('finishBtn').onclick=()=>{
 const total=state.equipment.reduce((n,e)=>n+e.qty,0),checked=state.equipment.reduce((n,e)=>n+checkedCount(e),0);
 if(checked<total && !confirm(`אושרו רק ${checked} מתוך ${total} יחידות. לשמור ולסיים בכל זאת?`))return;
 const map={};state.equipment.forEach(eq=>eq.assignments.forEach(a=>{if(!map[a.name])map[a.name]=[];map[a.name].push({equipment:eq.name,qty:a.qty})}));
 const item={id:Date.now(),date:new Date().toISOString(),dateLabel:fmtDate(),total,checked,equipment:state.equipment.map(e=>({name:e.name,qty:e.qty,checked:checkedCount(e),assignments:e.assignments})),people:Object.entries(map).map(([name,items])=>({name,items}))};
 const h=histories();h.unshift(item);saveHistories(h.slice(0,100));alert('האימון נשמר בהיסטוריה.');renderHistory();
};
document.getElementById('clearHistory').onclick=()=>{if(confirm('למחוק את כל היסטוריית האימונים?')){saveHistories([]);renderHistory()}};

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));document.getElementById(t.dataset.tab).classList.add('active');if(t.dataset.tab==='summary')renderSummary();if(t.dataset.tab==='history')renderHistory()});
renderAll();
</script>
</body>
</html>
