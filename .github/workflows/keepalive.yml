name: Keep cloud awake

# Supabase pauses free projects after about a week with little database activity; a paused project stops
# all cloud sync. One small query a day keeps it active. Uses only the public (publishable) key from cloud-config.js.
# GitHub turns off scheduled workflows after 60 days without repository activity; re-enable it from the Actions tab.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://rryvwztjrbvsczyamrtu.supabase.co
      SUPABASE_KEY: sb_publishable_J4tbUMWsyWLNEYxD368H1w_iE1n2Rat
    steps:
      - name: Query the database
        run: |
          for attempt in 1 2 3; do
            body="$(curl -sS --max-time 30 -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" \
              -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" -d '{}')" || true
            if [ "$body" = '"ok"' ]; then echo "Cloud is awake"; exit 0; fi
            echo "Attempt $attempt failed: $body"; sleep 20
          done
          echo "::error::The Supabase project did not answer. It may be paused: resume it from the Supabase dashboard."
          exit 1
