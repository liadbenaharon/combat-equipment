name: Flutter Android release AAB

on:
  workflow_dispatch:
  push:
    branches: [flutter-offline-first]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-release-aab.yml'

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install stable Flutter
        working-directory: ${{ runner.temp }}
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git flutter
          echo "${{ runner.temp }}/flutter/bin" >> "$GITHUB_PATH"

      - name: Prepare upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-key.jks"

      - name: Build signed release bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          SUPABASE_URL="$(sed -n "s/.*url:'\([^']*\)'.*/\1/p" ../cloud-config.js)"
          SUPABASE_PUBLISHABLE_KEY="$(sed -n "s/.*publishableKey:'\([^']*\)'.*/\1/p" ../cloud-config.js)"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_PUBLISHABLE_KEY"
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          flutter build appbundle --release \
            --dart-define="SUPABASE_URL=$SUPABASE_URL" \
            --dart-define="SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY"

      - uses: actions/upload-artifact@v4
        with:
          name: combat-equipment-flutter-release-aab
          path: flutter_app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
